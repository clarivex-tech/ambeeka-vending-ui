name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --no-watch --code-coverage

      - name: Build (production)
        run: npm run build:prod

      - name: Upload production site artifact
        uses: actions/upload-artifact@v4
        with:
          name: vending-app-site
          path: dist/vending-app/browser
          if-no-files-found: error
          retention-days: 1

  deploy-cloudfront:
    name: Deploy production to CloudFront
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CLOUDFRONT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: cloudfront-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download production site artifact
        uses: actions/download-artifact@v4
        with:
          name: vending-app-site
          path: site

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish site to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: aws s3 sync site "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
